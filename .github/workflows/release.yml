name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v0.1.0；publish=true 时必填）'
        type: string
        required: false
        default: ''
      publish:
        description: '创建 GitHub Release（否则只上传 artifacts）'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22.20.0'

jobs:
  verify:
    name: Verify version and tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            tag="$INPUT_TAG"
            publish="${INPUT_PUBLISH:-false}"
          fi
          if [[ "$publish" == "true" && -z "$tag" ]]; then
            echo "::error::publish=true 时必须提供 tag（如 v0.1.0）"
            exit 1
          fi
          if [[ -n "$tag" ]]; then
            version="$(./scripts/check-desktop-version.sh "$tag")"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            version="$(./scripts/check-desktop-version.sh)"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag publish=$publish"
      - name: Check CHANGELOG has this version
        run: ./scripts/release-notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  linux:
    name: Linux app (deb + AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
          workspaces: |
            . -> target
            app -> target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libxdo-dev patchelf file
      - name: Cache bundled pi runtime
        uses: actions/cache@v4
        with:
          path: app/pi-runtime
          key: pi-runtime-linux-${{ hashFiles('packaging/pi-runtime.json') }}
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build
        run: ./scripts/package-linux-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: dist/linux-app/*
          if-no-files-found: error

  windows:
    name: Windows app (NSIS + MSI + portable)
    needs: verify
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      # Short staging path keeps node_modules under MAX_PATH; the installer
      # destination itself is C:\Program Files\PiStar.
      PI_RUNTIME_DIR: C:/pirt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-2022
          workspaces: |
            . -> target
            app -> target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Enable long paths
        run: |
          git config --global core.longpaths true
          powershell.exe -NoProfile -Command "New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null"
      - name: Cache bundled pi runtime
        uses: actions/cache@v4
        with:
          path: C:/pirt
          key: pi-runtime-windows-${{ hashFiles('packaging/pi-runtime.json') }}
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build
        run: ./scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/windows/*
          if-no-files-found: error

  macos:
    name: macOS app (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
      MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
      MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
          workspaces: |
            . -> target
            app -> target
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Cache bundled pi runtime
        uses: actions/cache@v4
        with:
          path: app/pi-runtime
          key: pi-runtime-macos-${{ matrix.arch }}-${{ hashFiles('packaging/pi-runtime.json') }}
      - name: Import signing identity
        if: env.MAC_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/pi-star-signing.keychain-db"
          keychain_pass="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_pass" "$keychain" >/dev/null
          security list-keychains -d user | tr -d '"' | \
            xargs security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked
      - name: Build
        run: ./scripts/package-mac.sh
      - name: Notarize and staple
        if: env.MAC_NOTARY_API_KEY_ID != ''
        run: ./scripts/notarize-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/mac/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, linux, windows, macos]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Extract release notes
        run: ./scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > release-notes.md
      - name: List artifacts
        run: find artifacts -type f -printf '%p %s bytes\n' | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Pi Star ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          files: artifacts/**/*
