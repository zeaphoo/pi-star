[workspace]
resolver = "2"
members = ["crates/pi-star-core", "crates/pi-star"]
default-members = ["crates/pi-star"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hkdf = "0.12"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
notify = "8"
once_cell = "1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
parking_lot = "0.12"
rand = "0.8"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
ignore = "0.4"
quick-xml = "0.39"
zip = { version = "2", default-features = false, features = ["deflate"] }
