[workspace]
resolver = "2"
members = [
    "crates/pi-star-ai",
    "crates/pi-star-agent",
    "crates/pi-star-tools",
    "crates/pi-star-harness",
    "crates/pi-star-core",
    "crates/pi-star",
]
default-members = ["crates/pi-star"]
# Tauri 桌面壳是独立 workspace，见 app/Cargo.toml。
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
pi-star-ai = { path = "crates/pi-star-ai", version = "0.1.0" }
pi-star-agent = { path = "crates/pi-star-agent", version = "0.1.0" }
pi-star-tools = { path = "crates/pi-star-tools", version = "0.1.0" }
pi-star-harness = { path = "crates/pi-star-harness", version = "0.1.0" }

anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
globset = "0.4"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
jsonschema = "0.18"
hex = "0.4"
hkdf = "0.12"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
nix = { version = "0.29", features = ["process", "signal"] }
notify = "8"
once_cell = "1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
parking_lot = "0.12"
rand = "0.8"
portable-pty = "0.9"
schemars = { version = "0.8", features = ["preserve_order"] }
similar = { version = "2", features = ["text"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tempfile = "3"
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
yaml_serde = "=0.10.2"
ignore = "0.4"
quick-xml = "0.39"
zip = { version = "2", default-features = false, features = ["deflate"] }
